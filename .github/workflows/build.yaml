name: build

on: push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: fmt
        run: make fmt
      - name: tests
        run: make test

  release-build:
    name: release-build (${{ matrix.asset }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-musl,  os: ubuntu-latest, asset: linux-x86_64 }
          - { target: aarch64-linux-musl, os: ubuntu-latest, asset: linux-aarch64 }
          - { target: aarch64-macos,      os: macos-latest,  asset: macos-aarch64 }
          - { target: x86_64-macos,       os: macos-latest,  asset: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: build
        run: |
          version="${GITHUB_REF_NAME#v}"
          date="$(git log -1 --format=%cd --date=short)"
          zig build --release=safe -Dtarget=${{ matrix.target }} \
            -Dversion="$version" -Drelease-date="$date" -p out
      - name: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="md-${version}-${{ matrix.asset }}"
          mkdir -p "dist/${pkg}"
          cp out/bin/md README.md LICENSE "dist/${pkg}/"
          tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*.tar.gz dist/SHA256SUMS

